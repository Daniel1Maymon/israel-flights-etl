[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    data_integrity: data-health checks run against live DB (run periodically: pytest -m data_integrity)
    llm: calls the real LLM provider — costs tokens and is non-deterministic (run with '-m llm')
